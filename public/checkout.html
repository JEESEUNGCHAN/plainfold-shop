<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문서 | PLAIN FOLD</title>
  <!--@seo-->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#faf9f6">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <!--/@seo-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"><!--@header-->
    <div class="test-banner">테스트 모드 · 토스페이먼츠 테스트 키로 동작하며 실제 결제는 이루어지지 않아요</div>
    <div class="header-inner">
      <a href="/" class="logo">PLAIN FOLD</a>
      <nav class="main-nav">
        <a href="/products.html" class="nav-link">전체</a>
        <a href="/products.html?category=top" class="nav-link">상의</a>
        <a href="/products.html?category=bottom" class="nav-link">하의</a>
        <a href="/products.html?category=outer" class="nav-link">아우터</a>
        <a href="/products.html?category=acc" class="nav-link">잡화</a>
      </nav>
      <div class="header-actions">
        <form class="header-search" action="/products.html" role="search">
          <input type="search" name="q" placeholder="상품 검색" aria-label="상품 검색">
        </form>
        <a href="/cart.html" class="cart-link" aria-label="장바구니">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z M9 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
      </div>
    </div><!--/@header--></header>
  <main class="container">
    <div class="page-head"><h1>주문서</h1></div>
    <div class="checkout" id="checkout">
      <div class="checkout-main">
        <form id="order-form" class="panel" novalidate>
          <h2>배송 정보</h2>
          <div class="field">
            <label for="name">받는 분</label>
            <input id="name" name="name" maxlength="20" autocomplete="name" required>
            <p class="field-error" data-error-for="name"></p>
          </div>
          <div class="field">
            <label for="phone">휴대폰 번호</label>
            <input id="phone" name="phone" inputmode="numeric" placeholder="010-0000-0000" maxlength="13" autocomplete="tel" required>
            <p class="field-error" data-error-for="phone"></p>
          </div>
          <div class="field">
            <label for="address">주소</label>
            <input id="address" name="address" maxlength="100" placeholder="도로명 주소" autocomplete="street-address" required>
            <p class="field-error" data-error-for="address"></p>
          </div>
          <div class="field">
            <label for="addressDetail">상세 주소</label>
            <input id="addressDetail" name="addressDetail" maxlength="100" placeholder="동, 호수 등">
          </div>
          <div class="field">
            <label for="memo">배송 메모</label>
            <select id="memo" name="memo">
              <option value="">선택 안 함</option>
              <option>문 앞에 놓아 주세요</option>
              <option>경비실에 맡겨 주세요</option>
              <option>배송 전에 연락 주세요</option>
              <option>택배함에 넣어 주세요</option>
            </select>
          </div>
        </form>

        <section class="panel">
          <h2>결제 수단</h2>
          <p class="notice">테스트 모드라서 결제창에서 결제를 진행해도 실제로 돈이 나가지 않아요.</p>
          <div id="payment-method"></div>
          <div id="agreement"></div>
          <p class="field-error" id="widget-error"></p>
        </section>
      </div>

      <aside class="panel summary" id="summary"></aside>
    </div>
  </main>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <footer id="site-footer" class="site-footer"><!--@footer-->
    <div class="footer-inner">
      <div>
        <strong class="logo">PLAIN FOLD</strong>
        <p>매일 꺼내 입는 기본 옷을 만듭니다.</p>
      </div>
      <div class="footer-info">
        <p>가상의 브랜드로 만든 쇼핑몰입니다. 상품과 주문은 실제로 판매·배송되지 않습니다.</p>
        <p>결제: 토스페이먼츠 결제위젯 (테스트 모드)</p>
      </div>
    </div><!--/@footer--></footer>
  <script src="/js/garment.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
