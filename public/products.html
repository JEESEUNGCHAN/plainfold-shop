<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 목록 | PLAIN FOLD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 id="list-title">전체 상품</h1>
    </div>
    <div class="toolbar">
      <div class="chips" id="chips" role="tablist" aria-label="카테고리"></div>
      <div class="toolbar-right">
        <input type="search" id="search" placeholder="상품명 검색" aria-label="상품명 검색">
        <select id="sort" aria-label="정렬">
          <option value="new">신상품순</option>
          <option value="low">낮은 가격순</option>
          <option value="high">높은 가격순</option>
        </select>
      </div>
    </div>
    <p class="result-count" id="result-count"></p>
    <div class="grid" id="product-grid"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/garment.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
